<!doctype html>
<html lang="en">
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1" />
		<title>Lab 6 · Learning from Reward</title>
		<style>
			/* the same tokens, the same structure, and the same override order as
			   the book itself, so a lab drawn on a canvas can read its colors
			   instead of baking them */
			:root {
				color-scheme: light dark;
				--paper: #faf9f5;
				--ink: #1d1c18;
				--ink-3: #a3a094;
				--line: #e5e2d8;
				--accent: #2b45d8;
				--warm: #d3541f;
			}
			@media (prefers-color-scheme: dark) {
				:root:not(.light) {
					color-scheme: dark;
					--paper: #141310;
					--ink: #e9e6dc;
					--ink-3: #6c695e;
					--line: #2e2c24;
					--accent: #93a3ff;
					--warm: #ff8e57;
				}
			}
			:root.dark {
				color-scheme: dark;
				--paper: #141310;
				--ink: #e9e6dc;
				--ink-3: #6c695e;
				--line: #2e2c24;
				--accent: #93a3ff;
				--warm: #ff8e57;
			}
			body {
				margin: 0 auto;
				max-width: 72ch;
				padding: 2rem 1.25rem 4rem;
				background: var(--paper);
				color: var(--ink);
				font-family: ui-monospace, 'SF Mono', Menlo, monospace;
				font-size: 13px;
				line-height: 1.55;
			}
			h1 {
				font-size: 15px;
				font-weight: 600;
				letter-spacing: 0.02em;
			}
			p.blurb {
				opacity: 0.65;
			}
			pre {
				white-space: pre-wrap;
				word-break: break-word;
			}
			canvas {
				width: 100%;
				image-rendering: pixelated;
				border: 1px solid var(--line);
				border-radius: 6px;
			}
			a {
				color: inherit;
			}
		</style>
	</head>
	<body>
		<h1>Lab 6 · Learning from Reward</h1>
		<p class="blurb">
			REINFORCE on a sea chart in plain TypeScript — a boat that cannot sail into the wind, a
			harbour upwind, and a manoeuvre nobody mentioned. No GPU, no tensors. From
			<a href="https://github.com/NeoVand/jaxverse">jaxverse</a> — the little universe of learning
			machines.
		</p>
		<canvas id="stage" hidden></canvas>
		<pre id="out">booting…</pre>
		<script type="module" src="/src/main.ts"></script>
	</body>
</html>
