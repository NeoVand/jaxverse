<!doctype html>
<html lang="en">
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1" />
		<meta name="text-scale" content="scale" />
		<script>
			// Pre-paint theme: pinned 'light'/'dark' wins, otherwise follow the system.
			(function () {
				try {
					var t = localStorage.getItem('jaxverse-theme');
					if (t === 'light' || t === 'dark') document.documentElement.classList.add(t);
				} catch (e) {
					/* storage unavailable — system theme applies */
				}
			})();
		</script>
		%sveltekit.head%
	</head>
	<body data-sveltekit-preload-data="hover">
		<div style="display: contents">%sveltekit.body%</div>
	</body>
</html>
