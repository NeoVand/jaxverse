<!doctype html>
<html lang="en">
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1" />
		<meta name="text-scale" content="scale" />
		<script>
			// Pre-paint theme: a pinned choice wins; 'system' follows the OS;
			// with nothing chosen, the book opens dark.
			(function () {
				var t = 'dark';
				try {
					var s = localStorage.getItem('jaxverse-theme');
					if (s === 'light' || s === 'system') t = s;
				} catch (e) {
					/* storage unavailable — dark applies */
				}
				if (t !== 'system') document.documentElement.classList.add(t);
			})();
		</script>
		%sveltekit.head%
	</head>
	<body data-sveltekit-preload-data="hover">
		<div style="display: contents">%sveltekit.body%</div>
	</body>
</html>
